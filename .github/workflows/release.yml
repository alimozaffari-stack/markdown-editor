name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test preservation and paste behaviour
        run: npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Markdown Editor v__VERSION__"
          releaseBody: |
            Markdown Editor v__VERSION__ improves external-file continuity and release clarity.

            - Keeps a private, local list of the latest 50 externally opened Markdown files; originals remain in place and can be removed from the list individually or all at once.
            - Shows the packaged application version on the welcome screen, in the sidebar, and in Settings.
            - Preserves structured Gemini Canvas and rich HTML paste, with literal fallback if conversion loses content.
            - Adds **Paste exactly** and per-document **Preserve source formatting**.
            - Prevents clean documents and programme-driven editor changes from writing files.
            - Uses baseline conflict detection, recovery drafts, validated temporary files and atomic replacement.
            - Aligns Tiptap at 3.29.2 and replaces all internal and package branding with the authorised logo.

            Windows users can choose the `.exe` installer or `.msi` package. Linux packages are also attached. No macOS binary is published for this release.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
